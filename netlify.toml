# Site files live in "public". Functions live in "netlify/functions" (outside public on purpose).
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Keep the admin page out of search results and never cache it.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
